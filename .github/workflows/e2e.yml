# Browser tests for static/js (#339), as one reusable workflow. ci.yml calls it
# for pull requests and pushes to main; e2e-full.yml calls it for every push to
# big-release, the nightly run and a manual run. The steps live only here.
#
# This drives the real UI against the real backend, including the Tauri code
# path, which is where #335 hid because it was invisible in a browser.
# Split three ways, each shard on its own runner (#686). The suite runs
# serially inside a shard -- workers: 1 in playwright.config -- because it
# shares one backend and one jobs directory, and several specs change server
# state. A shard is a separate machine with its own backend, so splitting
# here adds parallelism without adding sharing. Files stay whole, since
# fullyParallel is off, so tests that rely on order within a file still get
# it. Free on a public repository; each shard pays its own setup.

name: e2e

on:
  workflow_call:
    inputs:
      mode:
        description: "full runs every spec; scoped runs the set scripts/ci/select-e2e.mjs picks for the diff against base-ref"
        type: string
        required: true
      base-ref:
        description: "Branch a scoped run diffs against (the pull request's base)"
        type: string
        default: ""
      checkout-ref:
        description: "Ref to test; empty means the commit of the triggering event"
        type: string
        default: ""

# The caller's token already has nothing; this keeps it that way if a new
# caller grants more. Checkout of this public repository and the artifact
# upload work without it.
permissions: {}

env:
  UV_LINK_MODE: copy
  # See the matching comment in ci.yml (#169).
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

jobs:
  frontend-e2e:
    runs-on: ubuntu-latest
    # A full shard takes about 10 minutes, setup included. This bounds a hung
    # run; it does not start a runner that GitHub never assigns, since queue
    # time does not count toward it.
    timeout-minutes: 30
    strategy:
      # One failing shard must not cancel the others: the report is only
      # useful whole.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          # Full history, so the base branch is there to diff against.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
          cache: npm
      # Empty output means everything. The inputs go through env, never into
      # the script text.
      - name: select specs
        env:
          MODE: ${{ inputs.mode }}
          BASE_REF: ${{ inputs.base-ref }}
        run: node scripts/ci/select-e2e.mjs --mode "$MODE" --base "$BASE_REF" > "$RUNNER_TEMP/e2e-specs.txt"
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --all-extras
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The backend under test is real, and finishing a recorded take renders
      # it with ffmpeg (app/pipeline/take_render.py). The runner image has no
      # ffmpeg, so without this the take specs get a 500 and time out.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # A reduced set can leave a shard with nothing to run, which must pass.
      # The spec list is unquoted on purpose: one argument per path.
      - run: npx playwright test --shard=${{ matrix.shard }}/3 --pass-with-no-tests $(cat "$RUNNER_TEMP/e2e-specs.txt")
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # Per shard: a second upload under the same name fails the job.
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
